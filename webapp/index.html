<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stil Tanlash</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #f5f5f5);
      color: var(--tg-theme-text-color, #222);
      min-height: 100vh;
      padding-bottom: 80px;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #fff;
      padding: 18px 16px 14px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }
    .header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .header p {
      font-size: 12px;
      opacity: 0.75;
      margin-top: 3px;
    }

    /* ── Content ── */
    .content { padding: 16px; }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* ── Card ── */
    .card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      border: 2px solid transparent;
      position: relative;
    }
    .card:active { transform: scale(0.97); }
    .card.selected {
      border-color: #0f3460;
      box-shadow: 0 4px 16px rgba(15,52,96,0.25);
    }
    .card.selected::after {
      content: '✓';
      position: absolute;
      top: 6px; right: 6px;
      width: 22px; height: 22px;
      background: #0f3460;
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      line-height: 22px;
      text-align: center;
    }
    .card img {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      display: block;
    }
    .card-label {
      padding: 7px 8px;
      font-size: 12px;
      font-weight: 600;
      color: #333;
      text-align: center;
      background: #fafafa;
      border-top: 1px solid #f0f0f0;
    }

    /* ── Bottom button ── */
    .bottom-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 12px 16px;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(8px);
      border-top: 1px solid #eee;
      z-index: 200;
    }
    .select-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #0f3460, #1a5276);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
      letter-spacing: 0.3px;
    }
    .select-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .select-btn:not(:disabled):active { opacity: 0.85; }
  </style>
</head>
<body>

<div class="header">
  <h1>🎨 Stil Tanlash</h1>
  <p>Taqdimot uchun stil tanlang</p>
</div>

<div class="content">
  <div class="grid" id="main-grid">
    <!-- JS tomonidan to'ldiriladi -->
  </div>
</div>

<!-- ── Bottom bar ── -->
<div class="bottom-bar">
  <button class="select-btn" id="select-btn" disabled onclick="confirmSelection()">
    Stil tanlang
  </button>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  let selectedKey = null;
  let selectedNum = null;

  // URL parametrdan tab ni aniqlash
  const urlParams = new URLSearchParams(window.location.search);
  const tab = urlParams.get('tab') || 'silver';

  const grid = document.getElementById('main-grid');

  if (tab === 'silver') {
    // Silver: 2 ta stil
    const silvers = [
      { key: 'oddiy1', num: 35, label: 'Oddiy 1', img: 'images/silver/oddiy1.png' },
      { key: 'oddiy2', num: 36, label: 'Oddiy 2', img: 'images/silver/oddiy2.png' },
    ];
    silvers.forEach(s => {
      const card = document.createElement('div');
      card.className = 'card';
      card.id = `card-${s.key}`;
      card.onclick = () => selectTemplate(s.key, s.num, s.label);
      card.innerHTML = `
        <img src="${s.img}" alt="${s.label}" loading="lazy"
             onerror="this.style.background='#eee';this.style.height='80px'"/>
        <div class="card-label">${s.label}</div>
      `;
      grid.appendChild(card);
    });
  } else {
    // Gold: 34 ta stil
    for (let i = 1; i <= 34; i++) {
      const card = document.createElement('div');
      card.className = 'card';
      card.id = `card-${i}`;
      card.onclick = () => selectTemplate(i, i, `Stil ${i}`);
      card.innerHTML = `
        <img src="images/gold/${i}.png" alt="Stil ${i}" loading="lazy"
             onerror="this.style.background='#eee';this.style.height='80px'"/>
        <div class="card-label">Stil ${i}</div>
      `;
      grid.appendChild(card);
    }
  }

  // ── Stil tanlash ──
  function selectTemplate(key, num, label) {
    document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
    selectedKey = key;
    selectedNum = num;
    const card = document.getElementById(`card-${key}`);
    if (card) card.classList.add('selected');
    const btn = document.getElementById('select-btn');
    btn.disabled = false;
    btn.textContent = `✅ ${label} — Tanlash`;
    if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
  }

  // ── Tasdiqlash ──
  function confirmSelection() {
    if (!selectedNum) return;
    tg.sendData(JSON.stringify({
      template_num: selectedNum,
      template_key: selectedKey
    }));
  }
</script>
</body>
</html>
