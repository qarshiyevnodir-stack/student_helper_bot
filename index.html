<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stil Tanlash</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #f5f5f5);
      color: var(--tg-theme-text-color, #222);
      min-height: 100vh;
      padding-bottom: 140px;
    }

    .header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #fff;
      padding: 18px 16px 14px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }
    .header h1 { font-size: 18px; font-weight: 700; }
    .header p  { font-size: 12px; opacity: 0.75; margin-top: 3px; }

    .content { padding: 16px; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      border: 2px solid transparent;
      position: relative;
    }
    .card:active { transform: scale(0.97); }
    .card.selected {
      border-color: #0f3460;
      box-shadow: 0 4px 16px rgba(15,52,96,0.25);
    }
    .card.selected::after {
      content: '✓';
      position: absolute;
      top: 6px; right: 6px;
      width: 22px; height: 22px;
      background: #0f3460;
      color: #fff;
      border-radius: 50%;
      font-size: 13px;
      font-weight: 700;
      line-height: 22px;
      text-align: center;
    }
    .card img {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      display: block;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 10px 16px 16px;
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(8px);
      border-top: 1px solid #eee;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .select-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #0f3460, #1a5276);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .select-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .select-btn:not(:disabled):active { opacity: 0.85; }

    .back-btn {
      width: 100%;
      padding: 13px;
      background: transparent;
      color: #555;
      border: 2px solid #ddd;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .back-btn:active { background: #f0f0f0; }

    #debug-info {
      position: fixed;
      top: 60px; left: 0; right: 0;
      background: rgba(0,0,0,0.7);
      color: #0f0;
      font-size: 10px;
      padding: 4px 8px;
      z-index: 999;
      display: none;
      word-break: break-all;
    }
  </style>
</head>
<body>

<div id="debug-info"></div>

<div class="header">
  <h1>🎨 Stil Tanlash</h1>
  <p>Taqdimot uchun stil tanlang</p>
</div>

<div class="content">
  <div class="grid" id="main-grid"></div>
</div>

<div class="bottom-bar">
  <button class="select-btn" id="select-btn" disabled onclick="confirmSelection()">
    Stil tanlang
  </button>
  <button class="back-btn" onclick="goBack()">⬅️ Orqaga</button>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  // Debug
  function dbg(msg) {
    const el = document.getElementById('debug-info');
    el.style.display = 'block';
    el.textContent = msg;
  }

  let selectedKey = null;
  let selectedNum = null;

  const urlParams = new URLSearchParams(window.location.search);
  const tab = urlParams.get('tab') || 'silver';

  const grid = document.getElementById('main-grid');

  function buildCard(key, num, imgSrc) {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card-' + key;
    card.onclick = function() { selectTemplate(key, num); };
    const img = document.createElement('img');
    img.src = imgSrc;
    img.alt = 'Stil ' + num;
    img.loading = 'lazy';
    img.onerror = function() {
      this.style.background = '#ddd';
      this.style.height = '80px';
    };
    card.appendChild(img);
    grid.appendChild(card);
  }

  if (tab === 'silver') {
    buildCard('oddiy1', 35, 'images/silver/oddiy1.png');
    buildCard('oddiy2', 36, 'images/silver/oddiy2.png');
  } else if (tab === 'platinum') {
    buildCard('platinum1', 37, 'images/platinum/platinum1.png');
    buildCard('gamma2', 38, 'images/platinum/gamma2.png');
  } else {
    for (var i = 1; i <= 34; i++) {
      buildCard(i, i, 'images/gold/' + i + '.png');
    }
  }

  function selectTemplate(key, num) {
    var cards = document.querySelectorAll('.card');
    for (var c = 0; c < cards.length; c++) {
      cards[c].classList.remove('selected');
    }
    selectedKey = key;
    selectedNum = num;
    var card = document.getElementById('card-' + key);
    if (card) card.classList.add('selected');
    var btn = document.getElementById('select-btn');
    btn.disabled = false;
    btn.textContent = '✅ Tanlash';
    if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
  }

  function confirmSelection() {
    if (!selectedNum) return;
    var payload = JSON.stringify({
      template_num: selectedNum,
      template_key: String(selectedKey)
    });
    dbg('Sending: ' + payload);
    tg.sendData(payload);
  }

  function goBack() {
    tg.close();
  }
</script>
</body>
</html>
